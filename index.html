<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NeoBrain</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NeoBrain">
<meta name="theme-color" content="#ffffff">
<style>
  :root {
    --bg:            #ffffff;
    --surface:       rgba(15,23,42,0.04);
    --surface-hover: rgba(15,23,42,0.07);
    --border:        rgba(15,23,42,0.08);
    --border-strong: rgba(15,23,42,0.16);
    --text-primary:  #0f172a;
    --text-secondary:#475569;
    --text-muted:    #94a3b8;
    --accent:        #6366f1;
    --accent2:       #8b5cf6;
    --accent-glow:   rgba(99,102,241,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 500px; height: 500px;
    top: -180px; left: -180px;
    background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
  }
  body::after {
    width: 400px; height: 400px;
    bottom: -120px; right: -120px;
    background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
  }
  .header {
    padding: 16px 16px 0;
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.7);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header .date { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .settings-icon { font-size: 20px; cursor: pointer; color: var(--text-secondary); padding: 4px; transition: color 0.15s; }
  .settings-icon:hover { color: var(--text-primary); }
  .content {
    flex: 1; padding: 16px;
    display: flex; flex-direction: column;
    position: relative; z-index: 1;
    gap: 10px;
  }
  #settingsPanel {
    display: none;
    background: rgba(15,23,42,0.04);
    border: 1px solid var(--border-strong);
    border-radius: 12px; padding: 16px;
    margin: 0 16px 12px;
    position: relative; z-index: 1;
    backdrop-filter: blur(8px);
  }
  #settingsPanel input {
    width: 100%; padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px; font-size: 14px;
    margin: 6px 0 12px;
    color: var(--text-primary); font-family: inherit; outline: none;
  }
  #settingsPanel input:focus { border-color: rgba(99,102,241,0.5); }
  #settingsPanel label { font-size: 13px; color: var(--text-secondary); }
  textarea {
    width: 100%; padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; font-size: 16px; line-height: 1.5;
    color: var(--text-primary); outline: none; font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: none;
  }
  textarea::placeholder { color: var(--text-muted); }
  textarea:focus {
    border-color: rgba(99,102,241,0.5);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
  }
  .field-label {
    font-size: 12px; font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .field { display: flex; flex-direction: column; }
  .image-preview { display: none; gap: 8px; flex-wrap: wrap; }
  .img-wrap { position: relative; display: inline-block; }
  .img-wrap img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-strong); }
  .img-remove {
    position: absolute; top: -6px; right: -6px;
    background: #ef4444; color: #fff;
    border-radius: 50%; width: 20px; height: 20px;
    font-size: 12px; line-height: 20px; text-align: center;
    cursor: pointer; border: none; font-weight: bold;
  }
  .tag-chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 24px; }
  .chip {
    padding: 4px 11px; border-radius: 20px;
    font-size: 12px; font-weight: 500;
    border: 1px solid var(--border-strong);
    background: transparent; color: var(--text-secondary);
    cursor: pointer; user-select: none; transition: all 0.15s;
  }
  .chip:hover { border-color: rgba(99,102,241,0.4); color: var(--text-primary); }
  .chip.selected {
    border-color: rgba(99,102,241,0.6);
    background: rgba(99,102,241,0.12);
    color: #4338ca; box-shadow: 0 0 10px rgba(99,102,241,0.15);
  }
  .chip.work-tag.selected {
    border-color: rgba(16,185,129,0.6);
    background: rgba(16,185,129,0.12);
    color: #047857; box-shadow: 0 0 10px rgba(16,185,129,0.15);
  }
  .tag-add-row { display: flex; gap: 6px; margin-top: 6px; }
  .tag-add-row input {
    flex: 1; padding: 5px 12px;
    background: transparent; border: 1px solid var(--border);
    border-radius: 20px; font-size: 13px; outline: none;
    color: var(--text-primary); font-family: inherit;
    -webkit-appearance: none; min-width: 0; transition: border-color 0.2s;
  }
  .tag-add-row input::placeholder { color: var(--text-muted); }
  .tag-add-row input:focus { border-color: rgba(99,102,241,0.5); }
  .tag-add-btn {
    flex: 0 0 auto; padding: 5px 14px;
    border: 1px solid var(--border-strong) !important;
    border-radius: 20px; font-size: 13px; font-weight: 600;
    background: var(--surface-hover) !important;
    color: var(--text-secondary) !important;
    cursor: pointer; -webkit-appearance: none; transition: color 0.15s, border-color 0.15s;
  }
  .tag-add-btn:hover { color: var(--text-primary) !important; border-color: rgba(99,102,241,0.4) !important; }
  .buttons { display: flex; gap: 8px; }
  button {
    flex: 1; padding: 14px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s, box-shadow 0.2s, transform 0.1s; font-family: inherit;
  }
  button:active { transform: scale(0.98); }
  .btn-icon {
    flex: 0 0 52px; font-size: 20px;
    background: var(--surface); border: 1px solid var(--border-strong);
    color: var(--text-secondary); transition: background 0.15s, color 0.15s;
  }
  .btn-icon:hover { background: var(--surface-hover); color: var(--text-primary); }
  .btn-submit {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; box-shadow: 0 4px 20px var(--accent-glow);
  }
  .btn-submit:hover:not(:disabled) { box-shadow: 0 6px 28px rgba(99,102,241,0.5); }
  .btn-submit:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
  .btn-settings {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; padding: 10px; border-radius: 8px;
    font-size: 14px; width: 100%; border: none; font-weight: 600;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .status { padding: 12px 14px; border-radius: 10px; font-size: 14px; display: none; }
  .status.ok  { background: rgba(5,150,105,0.10); border: 1px solid rgba(16,185,129,0.35); color: #047857; }
  .status.err { background: rgba(220,38,38,0.08); border: 1px solid rgba(239,68,68,0.35); color: #b91c1c; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>🧠 NeoBrain</h1>
      <div class="date" id="dateLabel"></div>
    </div>
    <span class="settings-icon" onclick="toggleSettings()">⚙️</span>
  </div>
</div>

<div id="settingsPanel">
  <label>GitHub Personal Access Token</label>
  <input type="password" id="inputToken" placeholder="ghp_xxxxxxxxxx">
  <label>リポジトリ (owner/repo)</label>
  <input type="text" id="inputRepo" placeholder="neo/neodiary">
  <button class="btn-settings" onclick="saveSettings()">保存</button>
</div>

<div class="content">

  <textarea id="main-text" rows="7" placeholder="今日の記録・メモを入力"></textarea>

  <div class="field">
    <div class="field-label">タグ</div>
    <div class="tag-chips" id="tag-chips"></div>
    <div class="tag-add-row">
      <input type="text" id="tag-input" placeholder="カスタムタグを追加…"
        onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomTag();}">
      <button class="tag-add-btn" onclick="addCustomTag()">＋追加</button>
    </div>
  </div>

  <div class="image-preview" id="file-preview"></div>
  <input type="file" id="file-input" accept="*/*" multiple style="display:none"
    onchange="onFilesSelected(event)">

  <div class="buttons">
    <button class="btn-icon" onclick="document.getElementById('file-input').click()" title="ファイル添付">📎</button>
    <button class="btn-submit" id="submit-btn" onclick="submit()">送信</button>
  </div>
  <div class="status" id="status"></div>

</div>

<script>
const today = new Date();
const pad = n => String(n).padStart(2, '0');
const dateStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
const timeStr = `${pad(today.getHours())}:${pad(today.getMinutes())}`;
const tsStr   = `${pad(today.getHours())}${pad(today.getMinutes())}${pad(today.getSeconds())}`;
document.getElementById('dateLabel').textContent = dateStr;

(function() {
  const p = location.search;
  if (p.startsWith('?url=')) {
    const sharedUrl = decodeURIComponent(p.slice(5));
    const ta = document.getElementById('main-text');
    ta.value = '\n\n' + sharedUrl;
    ta.setSelectionRange(0, 0);
    ta.focus();
    history.replaceState(null, '', location.pathname);
    fetchAndAppendSnippet(ta, sharedUrl);
  }
})();

async function fetchAndAppendSnippet(ta, url) {
  let html = null;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    const res = await fetch(url, { mode: 'cors', signal: ctrl.signal });
    clearTimeout(timer);
    if (res.ok) html = await res.text();
  } catch {}
  if (!html) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), { signal: ctrl.signal });
      clearTimeout(timer);
      if (res.ok) html = await res.text();
    } catch {}
  }
  if (!html) return;

  const doc = new DOMParser().parseFromString(html, 'text/html');
  const title = (doc.querySelector('meta[property="og:title"]')?.content ||
                 doc.querySelector('title')?.textContent || '').trim();
  const desc  = (doc.querySelector('meta[property="og:description"]')?.content ||
                 doc.querySelector('meta[name="description"]')?.content || '').trim();
  if (!title && !desc) return;

  let snippet = '\n---\n';
  if (title) snippet += `📎 ${title}\n`;
  if (desc)  snippet += `📝 ${desc}\n`;
  ta.value += snippet;
}

function loadSettings() {
  document.getElementById('inputToken').value = localStorage.getItem('gh_token') || '';
  document.getElementById('inputRepo').value  = localStorage.getItem('gh_repo')  || '';
}
function saveSettings() {
  localStorage.setItem('gh_token', document.getElementById('inputToken').value.trim());
  localStorage.setItem('gh_repo',  document.getElementById('inputRepo').value.trim());
  showStatus('✅ 設定を保存しました', 'ok');
  setTimeout(() => document.getElementById('settingsPanel').style.display = 'none', 800);
}
function toggleSettings() {
  const p = document.getElementById('settingsPanel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  loadSettings();
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = `status ${type}`; el.style.display = 'block';
  if (type === 'ok') setTimeout(() => el.style.display = 'none', 2500);
}

const BASE_TAGS = [
  // personal
  { tag: 'personal/triathlon',      label: 'triathlon' },
  { tag: 'personal/book',           label: 'book' },
  { tag: 'personal/dog',            label: 'dog' },
  { tag: 'personal/realestate',     label: 'realestate' },
  { tag: 'personal/reflection',     label: 'reflection' },
  // work
  { tag: 'work/mercer',             label: 'mercer' },
  { tag: 'work/bd',                 label: 'bd' },
  { tag: 'work/research',           label: 'research' },
  { tag: 'work/thought_leadership', label: 'thought' },
];

const CK_COUNTS = 'tag_counts_v2';
const CK_CUSTOM = 'custom_tags_v2';

function getTagCounts()    { return JSON.parse(localStorage.getItem(CK_COUNTS) || '{}'); }
function getCustomTags()   { return JSON.parse(localStorage.getItem(CK_CUSTOM) || '[]'); }
function saveTagCounts(c)  { localStorage.setItem(CK_COUNTS, JSON.stringify(c)); }
function saveCustomTags(t) { localStorage.setItem(CK_CUSTOM, JSON.stringify(t)); }

// 既存の v1 キーから一度だけ移行
(function migrateLegacyTagState() {
  if (localStorage.getItem('tag_counts_v2') !== null) return;
  const merged = {
    ...JSON.parse(localStorage.getItem('tag_counts')      || '{}'),
    ...JSON.parse(localStorage.getItem('work_tag_counts') || '{}'),
  };
  const customs = [
    ...JSON.parse(localStorage.getItem('custom_tags')      || '[]'),
    ...JSON.parse(localStorage.getItem('work_custom_tags') || '[]'),
  ];
  saveTagCounts(merged);
  saveCustomTags(Array.from(new Set(customs)));
})();

function renderTags() {
  const counts  = getTagCounts();
  const customs = getCustomTags();
  const all = [...BASE_TAGS, ...customs.map(t => ({ tag: t, label: t.split('/').pop() }))];
  all.sort((a, b) => (counts[b.tag] || 0) - (counts[a.tag] || 0));

  const container = document.getElementById('tag-chips');
  container.innerHTML = '';
  all.forEach(({ tag, label }) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (tag.startsWith('work/') ? ' work-tag' : '');
    chip.dataset.tag = tag;
    chip.textContent = label;
    chip.addEventListener('click', () => chip.classList.toggle('selected'));
    container.appendChild(chip);
  });
}

function addCustomTag() {
  const input = document.getElementById('tag-input');
  const raw   = input.value.trim().replace(/\s+/g, '_');
  if (!raw) return;
  const tag    = raw.includes('/') ? raw : `custom/${raw}`;
  const list   = getCustomTags();
  if (!list.includes(tag)) { list.push(tag); saveCustomTags(list); }
  input.value = '';
  renderTags();
  document.querySelectorAll('#tag-chips .chip').forEach(c => {
    if (c.dataset.tag === tag) c.classList.add('selected');
  });
}

function getSelectedTags() {
  return Array.from(document.querySelectorAll('#tag-chips .chip.selected')).map(c => c.dataset.tag);
}
function incrementTagCounts(tags) {
  const counts = getTagCounts();
  tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
  saveTagCounts(counts);
}

renderTags();

function compressImage(file, maxBytes) {
  return new Promise(resolve => {
    if (!file.type.startsWith('image/') || file.size <= maxBytes) {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file); return;
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      const maxDim = 1600;
      if (w > maxDim || h > maxDim) {
        const ratio = Math.min(maxDim/w, maxDim/h);
        w = Math.round(w*ratio); h = Math.round(h*ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    };
    img.src = url;
  });
}

const pendingFiles = [];
async function onFilesSelected(event) {
  const files = Array.from(event.target.files);
  event.target.value = '';
  for (const file of files) {
    const dataUrl = await compressImage(file, 900 * 1024);
    pendingFiles.push({ file, dataUrl, b64: dataUrl.split(',')[1] });
    renderPreviews();
  }
}
function renderPreviews() {
  const area = document.getElementById('file-preview');
  area.innerHTML = '';
  if (!pendingFiles.length) { area.style.display = 'none'; return; }
  area.style.display = 'flex';
  pendingFiles.forEach((item, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'img-wrap';
    if (item.file.type.startsWith('image/')) {
      const img = document.createElement('img'); img.src = item.dataUrl; wrap.appendChild(img);
    } else {
      const label = document.createElement('div');
      label.style.cssText = 'width:72px;height:72px;background:rgba(255,255,255,0.05);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#64748b;text-align:center;padding:4px;word-break:break-all;border:1px solid rgba(255,255,255,0.13)';
      label.textContent = item.file.name; wrap.appendChild(label);
    }
    const btn = document.createElement('button');
    btn.className = 'img-remove'; btn.textContent = '×';
    btn.onclick = () => { pendingFiles.splice(idx, 1); renderPreviews(); };
    wrap.appendChild(btn); area.appendChild(wrap);
  });
}

function ghHeaders(token) {
  return { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
}
async function ghPut(token, repo, path, message, b64) {
  const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    method: 'PUT', headers: ghHeaders(token),
    body: JSON.stringify({ message, content: b64 }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(`GitHub API error: ${res.status}${body.message ? ' – ' + body.message : ''}`);
  }
  return res.json();
}
async function uploadFiles(token, repo, files, folder, ts) {
  const urls = [];
  for (let i = 0; i < files.length; i++) {
    const { file, b64 } = files[i];
    const ext  = file.name.split('.').pop().toLowerCase() || 'bin';
    const path = `${folder}/${dateStr}_${ts}_${i+1}.${ext}`;
    const data = await ghPut(token, repo, path, `attach: ${dateStr} ${timeStr}`, b64);
    urls.push(data.content.download_url);
  }
  return urls;
}

async function submit() {
  const text = document.getElementById('main-text').value.trim();
  if (!text && !pendingFiles.length) {
    showStatus('テキストまたはファイルを入力してください', 'err'); return;
  }
  const token = localStorage.getItem('gh_token');
  const repo  = localStorage.getItem('gh_repo');
  if (!token || !repo) {
    showStatus('⚙️ 設定からTokenとリポジトリを入力してください', 'err'); toggleSettings(); return;
  }

  const tags  = getSelectedTags();
  // タグに work/* が含まれていれば workmemo へ、それ以外（personal/* / custom/* / 無タグ）は inbox へ
  const isWork       = tags.some(t => t.startsWith('work/'));
  const filesFolder  = isWork ? 'workmemo/files' : 'inbox/images';
  const entryFolder  = isWork ? 'workmemo'        : 'inbox';

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    let fileUrls = [];
    if (pendingFiles.length) {
      showStatus('📎 ファイルアップロード中…', 'ok');
      fileUrls = await uploadFiles(token, repo, pendingFiles, filesFolder, tsStr);
    }

    let entry;
    if (isWork) {
      // workmemo フォーマット（CLIENT は backend 互換のため internal を既定値で記録）
      entry  = `[CLIENT: internal]\n`;
      if (tags.length) entry += `[TAGS: ${tags.join(', ')}]\n`;
      entry += `[TIME: ${timeStr}]\n`;
      entry += `${text}\n`;
    } else {
      entry  = `[${timeStr}]\n`;
      if (tags.length) entry += `[TAGS: ${tags.join(', ')}]\n`;
      entry += `${text}\n`;
    }
    if (fileUrls.length) {
      entry += '\n' + fileUrls.map(u => {
        const isImg = /\.(png|jpe?g|gif|webp|heic)$/i.test(u);
        return isImg ? `![画像](${u})` : `[FILE: ${u}]`;
      }).join('\n') + '\n';
    }

    const message = isWork
      ? `memo: ${dateStr} ${timeStr}`
      : `diary: ${dateStr} ${timeStr}`;
    await ghPut(token, repo, `${entryFolder}/${dateStr}_${tsStr}.txt`,
      message, btoa(unescape(encodeURIComponent(entry))));

    if (tags.length) incrementTagCounts(tags);
    showStatus(`✅ 保存しました（${dateStr} ${timeStr}）`, 'ok');
    document.getElementById('main-text').value = '';
    pendingFiles.length = 0; renderPreviews(); renderTags();
  } catch(e) {
    showStatus(`❌ 送信失敗: ${e.message}`, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '送信';
  }
}
</script>
</body>
</html>
